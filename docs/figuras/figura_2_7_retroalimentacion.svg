<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#46515F"/></marker></defs>
<rect width="1500" height="520" fill="#FFFFFF"/><text x="750" y="52" text-anchor="middle" font-family="Arial" font-size="23" font-weight="bold" fill="#1F2937">Generación controlada de retroalimentación</text><rect x="45" y="160" width="260" height="155" rx="8" fill="#DCEAF7" stroke="#4779A8" stroke-width="2"/><text x="175.0" y="198" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#1F2937">Hallazgos estructurados</text><text x="175.0" y="232" text-anchor="middle" font-family="Arial" font-size="16" font-weight="normal" fill="#5B6472">segmento y tiempo</text><text x="175.0" y="259" text-anchor="middle" font-family="Arial" font-size="16" font-weight="normal" fill="#5B6472">tipo y severidad</text><text x="175.0" y="286" text-anchor="middle" font-family="Arial" font-size="16" font-weight="normal" fill="#5B6472">evidencia numérica</text><rect x="390" y="90" width="275" height="135" rx="8" fill="#E5F2EA" stroke="#4D8064" stroke-width="2"/><text x="527.5" y="128" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#1F2937">Plantillas</text><text x="527.5" y="162" text-anchor="middle" font-family="Arial" font-size="16" font-weight="normal" fill="#5B6472">reglas deterministas</text><text x="527.5" y="189" text-anchor="middle" font-family="Arial" font-size="16" font-weight="normal" fill="#5B6472">mensajes previsibles</text><rect x="390" y="285" width="275" height="135" rx="8" fill="#FFF3D6" stroke="#A87822" stroke-width="2"/><text x="527.5" y="323" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#1F2937">Modelo de lenguaje</text><text x="527.5" y="357" text-anchor="middle" font-family="Arial" font-size="16" font-weight="normal" fill="#5B6472">redacción contextual</text><text x="527.5" y="384" text-anchor="middle" font-family="Arial" font-size="16" font-weight="normal" fill="#5B6472">alternativa en evaluación</text><rect x="760" y="160" width="275" height="155" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/><text x="897.5" y="198" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#1F2937">Validación</text><text x="897.5" y="232" text-anchor="middle" font-family="Arial" font-size="16" font-weight="normal" fill="#5B6472">coherencia con datos</text><text x="897.5" y="259" text-anchor="middle" font-family="Arial" font-size="16" font-weight="normal" fill="#5B6472">formato y límites</text><text x="897.5" y="286" text-anchor="middle" font-family="Arial" font-size="16" font-weight="normal" fill="#5B6472">sin causas inventadas</text><rect x="1130" y="160" width="320" height="155" rx="8" fill="#FBE8E8" stroke="#A84B4B" stroke-width="2"/><text x="1290.0" y="198" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#1F2937">Retroalimentación final</text><text x="1290.0" y="232" text-anchor="middle" font-family="Arial" font-size="16" font-weight="normal" fill="#5B6472">qué ocurrió</text><text x="1290.0" y="259" text-anchor="middle" font-family="Arial" font-size="16" font-weight="normal" fill="#5B6472">dónde ocurrió</text><text x="1290.0" y="286" text-anchor="middle" font-family="Arial" font-size="16" font-weight="normal" fill="#5B6472">orientación de práctica</text><line x1="305" y1="237" x2="390" y2="158" stroke="#46515F" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="305" y1="237" x2="390" y2="352" stroke="#46515F" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="665" y1="158" x2="760" y2="220" stroke="#46515F" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="665" y1="352" x2="760" y2="255" stroke="#46515F" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1035" y1="237" x2="1130" y2="237" stroke="#46515F" stroke-width="2.5" marker-end="url(#arrow)"/><text x="750" y="475" text-anchor="middle" font-family="Arial" font-size="17" font-weight="normal" fill="#5B6472">El generador redacta los hallazgos; no determina los problemas acústicos</text></svg>